name: Zeon Web Mobile — verificações
on:
  push:
    branches:
      - feature/zeon-mobile-navigation
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar arquivos e integrações Web Mobile
        run: node --test tests/mobile-phase1.test.cjs
