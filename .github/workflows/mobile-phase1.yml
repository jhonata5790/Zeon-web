name: Zeon Web Mobile — verificações
on:
  push:
    branches:
      - feature/zeon-mobile-navigation
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ambiente de testes DOM
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - name: Verificar arquivos e interações Web Mobile
        run: node --test tests/mobile-phase1.test.cjs tests/mobile-interaction.test.cjs
