<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeon DeepScan — Benchmark Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;object-fit:fill}nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#111d;padding:8px;border-radius:9px}button{background:#362b69;color:#fff;border:1px solid #a594ed;border-radius:5px;padding:7px;cursor:pointer}nav[hidden]{display:none}</style></head><body><canvas id="scene" width="1280" height="720"></canvas><nav id="nav"><button data-mode="0">Texto/linhas</button><button data-mode="1">Estática</button><button data-mode="2">Movimento</button><button data-mode="3">Partículas</button><button data-mode="4">Gradiente</button><button data-mode="5">Cortes de cena</button><button id="auto">Sequência 90 s</button><button id="full">Tela cheia</button><button id="hide">Ocultar controles</button><span id="status">F1–F6 · A automático · H controles</span></nav><script>(function lab(){
'use strict';const canvas=document.getElementById('scene'),c=canvas.getContext('2d',{alpha:false}),nav=document.getElementById('nav'),status=document.getElementById('status');let mode=0,start=performance.now(),auto=false,sequence=0;const colors=['#ffffff','#e0d000','#00d5d5','#00c000','#d000d0','#e00000','#0039e0','#101010'],names=['TEXTO E LINHAS','ESTÁTICA','MOVIMENTO','PARTÍCULAS','GRADIENTE','CORTES'];function select(n){auto=false;mode=n;start=performance.now();}for(const b of nav.querySelectorAll('[data-mode]'))b.onclick=()=>select(Number(b.dataset.mode));document.getElementById('auto').onclick=()=>{auto=true;start=performance.now()};document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});document.getElementById('hide').onclick=()=>nav.hidden=true;document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')nav.hidden=!nav.hidden;if(e.key==='a'||e.key==='A'){auto=true;start=performance.now()}if(/^F[1-6]$/.test(e.key)){e.preventDefault();select(Number(e.key.slice(1))-1)}});
function marker(scene,seq){const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};put(0xD3A,12);put(scene,3);put(seq&65535,16);put(Date.now()%2147483648,31);let check=0;for(const bit of bits)check=((check<<1)^bit^((check&128)?7:0))&255;put(check,8);c.fillStyle='#888';c.fillRect(0,0,1280,52);bits.forEach((b,i)=>{c.fillStyle=b?'#fff':'#000';c.fillRect(80+i*16,12,16,28)});}
function draw(t){const dt=(t-start)/1000;const m=auto?Math.min(5,Math.floor(dt/15)):mode;const tick=Math.floor(dt*60);c.fillStyle='#101522';c.fillRect(0,0,1280,720);c.fillStyle='#e8efff';c.font='bold 28px sans-serif';c.fillText('ZEON DEEPSCAN  /  '+names[m],32,96);if(m===0){[9,12,15,20,28,40].forEach((n,i)=>{c.font=n+'px sans-serif';c.fillText('ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789 — Zeon '+n+' px',40,144+i*54);});for(let i=0;i<180;i++){c.fillStyle=i%2?'white':'black';c.fillRect(850+i*2,125,2,350)}}else if(m===1){for(let y=0;y<7;y++)for(let x=0;x<16;x++){c.fillStyle=(x+y)%2?'#eee':'#20232c';c.fillRect(x*80,128+y*58,80,58)}c.fillStyle='#7c5cff';c.fillRect(470,200,340,260)}else if(m===2){for(let i=0;i<16;i++){const x=((tick*(2+i%5)+i*117)%1420)-80;c.fillStyle=colors[i%8];c.fillRect(x,145+i*25,90,22)}c.strokeStyle='white';c.lineWidth=3;c.beginPath();c.arc(640+Math.sin(dt*2)*420,330,75,0,Math.PI*2);c.stroke()}else if(m===3){for(let i=0;i<2500;i++){const x=((i*7919+tick*(i%7+1)*3)%1280),y=120+((i*3571+tick*(i%11+1))%405);c.fillStyle=colors[i%8];c.fillRect(x,y,3+(i%5),3+(i%5))}}else if(m===4){let g=c.createLinearGradient(0,0,1280,0);g.addColorStop(0,'black');g.addColorStop(1,'white');c.fillStyle=g;c.fillRect(0,135,1280,170);g=c.createLinearGradient(0,0,1280,0);['red','yellow','lime','cyan','blue','magenta','red'].forEach((v,i)=>g.addColorStop(i/6,v));c.fillStyle=g;c.fillRect(0,320,1280,170)}else{c.fillStyle=colors[Math.floor(dt*2)%8];c.fillRect(0,115,1280,410);c.fillStyle='#000';c.font='bold 85px monospace';c.fillText('CORTE '+Math.floor(dt*2),230,340)}colors.forEach((v,i)=>{c.fillStyle=v;c.fillRect(i*160,560,160,120)});marker(m,sequence++);status.textContent=(auto?'Automático':'Manual')+' · '+names[m]+' · '+dt.toFixed(1)+'s · F1–F6 / H';if(auto&&dt>=90){auto=false;mode=5;start=t;}requestAnimationFrame(draw)}requestAnimationFrame(draw);
})();</script></body></html>
